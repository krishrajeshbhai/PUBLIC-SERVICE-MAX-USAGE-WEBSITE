version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: transitone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transitone
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: transitone-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    restart: always

volumes:
  postgres-data:
  redis-data:
